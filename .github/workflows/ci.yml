name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:enquiry
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      # performance budgets warn (runner speed varies); accessibility, best practices, SEO and CLS fail the build
      # collect, print the scores, then assert (autorun would stop at a failed assertion, and the scores are what we need to read)
      - run: npx -y @lhci/cli@0.16.1 collect
      - run: node scripts/lhci-summary.mjs
      # temporary diagnostic: which requests and tasks decide the simulated LCP on the two image-LCP pages
      - name: LCP nodes
        continue-on-error: true
        run: |
          npm i --no-save --no-audit --no-fund lighthouse@12
          npx next start -p 3100 &
          sleep 6
          for p in real-estate-vr vr-headset-rental ""; do
            npx lighthouse "http://localhost:3100/$p" --quiet --chrome-flags="--headless=new --no-sandbox" -G ".lh-gather" --only-categories=performance
            node scripts/lcp-nodes.mjs .lh-gather "${p:-home}"
          done
          kill %1 || true
      # keep LHCI's verdict readable from the run page: failed lines become annotations
      - run: |
          set +e
          npx -y @lhci/cli@0.16.1 assert 2>&1 | tee assert.txt
          code=${PIPESTATUS[0]}
          grep -E "✘|✖|failed|error|warning" assert.txt | head -30 | while read -r l; do echo "::notice title=lhci assert::$l"; done
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
